[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spacenav"
version = "0.2.0"
description = "GPU n-body space navigation game and RL testbed"
requires-python = ">=3.10"
dependencies = [
    "jax[cuda12]>=0.9",
    "flax>=0.10",
    "optax>=0.2",
    "numpy>=1.26",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["spacenav*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
