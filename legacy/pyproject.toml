[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spaceship-navigator"
version = "0.1.0"
description = "GPU-accelerated n-body gravitational simulation with RL agent training"
requires-python = ">=3.10"
dependencies = [
    "flax>=0.8.0",
    "optax>=0.2.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "websockets>=12.0",
    "numpy>=1.26.0",
    "msgpack>=1.0.0",
    "pyyaml>=6.0",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]
cuda = [
    "jax[cuda12]>=0.4.30",
]
cpu = [
    "jax>=0.4.30",
]

[project.scripts]
spaceship-train = "training.train:main"
spaceship-serve = "server.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
