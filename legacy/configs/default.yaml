# Spaceship Navigator - Default Configuration
# Solar-system scale gravitational simulation
# Uses direct N-body (3D 1/r²) for dynamics, Poisson for observation field

simulation:
  # Grid settings
  grid_size: 256            # Physics grid resolution (NxN)
  domain_size: 100.0        # Domain size in AU
  dt: 3600.0                # Timestep in seconds (1 hour)
  max_steps: 8760           # Max steps per episode (~1 year at 1hr steps)

  # Physics constants (SI)
  G: 6.6743e-11
  c: 2.99792458e+8          # Speed of light m/s
  AU: 1.496e+11             # 1 AU in meters
  GM_sun: 1.327e+20         # Heliocentric gravitational parameter

  # Ship settings
  # Ion thruster: low thrust, high efficiency, long burn times
  ship:
    dry_mass: 5000.0        # kg (small spacecraft)
    fuel_mass: 2000.0       # kg (xenon propellant)
    max_thrust: 0.5         # Newtons (realistic ion thruster ~0.1-1N)
    exhaust_velocity: 30000.0  # m/s (Isp ~3060s, typical ion thruster)
    max_torque: 0.01        # N*m (reaction wheels + small RCS)
    moment_arm: 2.0         # meters
    rotation_exhaust_velocity: 50000.0  # m/s (cold gas RCS, very efficient)
    moment_of_inertia: 8000.0  # kg*m^2
    radius: 5.0             # meters

  # Target settings
  target:
    approach_radius: 0.01   # AU (~1.5 million km)
    approach_velocity: 1000.0  # m/s - velocity matching threshold

# Level generation
# Based on real solar system distributions
level_gen:
  seed: 42
  # Body counts: 1 star + planets + rogues
  num_planets_range: [4, 10]
  num_rogues_range: [1, 3]

  # Star: solar-mass range
  primary_mass_range: [1.0e+30, 2.5e+30]

  # Planets: bimodal distribution (terrestrial + gas giant)
  # Terrestrial: 1e23 - 1e25 kg (Mercury to super-Earth)
  # Gas giant: 1e26 - 1e28 kg (Neptune to super-Jupiter)
  terrestrial_mass_range: [1.0e+23, 1.0e+25]
  giant_mass_range: [1.0e+26, 1.0e+28]
  giant_fraction: 0.25       # ~25% of planets are giants

  # Orbital placement: geometric spacing ratio 1.4-2.0x
  inner_orbit_au: 0.3        # Innermost orbit (AU)
  orbit_spacing_range: [1.4, 2.0]  # Each orbit is this factor * previous

  # Eccentricities: Rayleigh distribution
  eccentricity_sigma: 0.06   # Mean ecc ~0.075, most < 0.15
  max_eccentricity: 0.3      # Hard cap

  # Rogues: asteroids/comets on hyperbolic-ish trajectories
  rogue_mass_range: [1.0e+15, 1.0e+20]
  min_start_target_distance: 5.0  # AU

  # Softening for N-body force calculation
  softening: 1.0e+9          # ~7000 km, prevents singularities

# Observation
observation:
  history_buffer_size: 128
  obs_grid_size: 64

# Reward
reward:
  arrival_bonus: 1000.0
  proximity_scale: 10.0
  time_penalty: -0.001       # Small per-step (episodes are long)
  fuel_penalty: -0.5         # Fuel is precious with ion thrusters
  velocity_match_bonus: 100.0
  max_episode_time: 8760

# Training (PPO)
training:
  num_envs: 32
  num_steps: 256
  num_epochs: 4
  num_minibatches: 8
  learning_rate: 3.0e-4
  gamma: 0.999
  gae_lambda: 0.95
  clip_eps: 0.2
  entropy_coeff: 0.01
  value_coeff: 0.5
  max_grad_norm: 0.5
  total_timesteps: 10000000
  save_interval: 100
  eval_interval: 50
